# The local stack, for Docker or Podman. `make dev` runs `compose up --build --watch`.
# Source directories are mounted read-only: the frontend dev server and
# uvicorn reload on their own, and watch restarts the MCP server, which
# recompiles on start. (Watch's sync and rebuild actions misbehave on Podman, so neither
# is used.) After changing dependencies, rerun `make dev`. `make images`
# builds the deployable images.
name: matchday-muse

services:
  mcp-server:
    build:
      context: ./mcp-server
      target: dev
    image: matchday-muse/mcp-server:dev
    environment:
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?set MCP_AUTH_TOKEN in .env; make .env creates one}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-fixture}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./mcp-server:/src:ro
      - mcp-cache:/data/cache
      - go-build-cache:/root/.cache/go-build
    healthcheck:
      test: ["CMD", "/tmp/mcp-server", "healthcheck"]
      interval: 10s
      timeout: 5s
      # The first start compiles the server.
      start_period: 60s
      retries: 3
    ports:
      # Published on localhost only, for MCP Inspector on the host.
      - "127.0.0.1:8081:8081"
    develop:
      watch:
        - action: restart
          path: ./mcp-server
          ignore:
            - bin/
            - testdata/espn/
            - "**/*_test.go"

  backend:
    build:
      context: ./backend
      target: dev
    image: matchday-muse/backend:dev
    environment:
      MCP_SERVER_URL: http://mcp-server:8081/mcp
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?set MCP_AUTH_TOKEN in .env; make .env creates one}
      MOCK_LLM: ${MOCK_LLM:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./backend/app:/app/app:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      mcp-server:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: dev
    image: matchday-muse/frontend:dev
    environment:
      # ng serve proxies /ws here.
      BACKEND_URL: http://backend:8000
    volumes:
      - ./frontend/src:/app/frontend/src:ro
      - ./contracts/ws:/app/contracts/ws:ro
    ports:
      - "127.0.0.1:4200:4200"

volumes:
  mcp-cache:
  go-build-cache:
